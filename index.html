  <script type="text/babel">
    // Simple UUID function implementation
    function uuidv4() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }
    
    // Pyodide instance
    let pyodideInstance = null;
    let pyodideLoading = false;
    
    // Initialize Pyodide
    const initializePyodide = async () => {
      if (pyodideInstance) return pyodideInstance;
      
      try {
        pyodideLoading = true;
        console.log("Loading Pyodide...");
        const pyodide = await loadPyodide();
        
        // Load common scientific packages
        console.log("Loading scientific packages (NumPy, etc.)...");
        await pyodide.loadPackage(["numpy", "pandas", "matplotlib"]);
        
        // Setup basic environment and verify it works
        console.log("Setting up Python environment...");
        await pyodide.runPythonAsync(`
          import sys
          import io
          
          # Verify io module is loaded
          print("io module loaded successfully")
          
          # Test StringIO
          test_io = io.StringIO()
          test_io.write("Test string")
          print("StringIO test:", test_io.getvalue())
          
          # Test print redirection
          orig_stdout = sys.stdout
          test_capture = io.StringIO()
          sys.stdout = test_capture
          print("This is a test print statement")
          sys.stdout = orig_stdout
          print("Print redirection test:", test_capture.getvalue())
        `);
        
        console.log("Pyodide loaded successfully");
        pyodideInstance = pyodide;
        pyodideLoading = false;
        return pyodide;
      } catch (error) {
        console.error("Failed to load Pyodide:", error);
        pyodideLoading = false;
        throw error;
      }
    };
    
    // Execute Python code
    async function executePythonCode(code) {
      if (!pyodideInstance) {
        try {
          pyodideInstance = await initializePyodide();
          if (!pyodideInstance) {
            return { error: "Failed to initialize Python environment" };
          }
        } catch (error) {
          return { error: `Python initialization error: ${error.message}` };
        }
      }
      
      try {
        // Simplest possible approach focused on capturing all output
        console.log("Original code:", code);
        
        // First set up the Python environment for output capturing
        await pyodideInstance.runPythonAsync(`
          import sys
          import io
          
          class CaptureIO(io.StringIO):
              def __init__(self):
                  super().__init__()
              
              def write(self, s):
                  super().write(s)
                  return len(s)
          
          # Create global capture instances if they don't exist
          if not hasattr(sys, '_jupyreact_stdout'):
              sys._jupyreact_stdout = CaptureIO()
              sys._jupyreact_stderr = CaptureIO()
          else:
              # Clear buffers
              sys._jupyreact_stdout.seek(0)
              sys._jupyreact_stdout.truncate(0)
              sys._jupyreact_stderr.seek(0)
              sys._jupyreact_stderr.truncate(0)
          
          # Remember original streams
          sys._original_stdout = sys.stdout
          sys._original_stderr = sys.stderr
          
          # Redirect
          sys.stdout = sys._jupyreact_stdout
          sys.stderr = sys._jupyreact_stderr
        `);
        
        // Execute the actual code
        let result;
        try {
          result = pyodideInstance.runPython(code);
          console.log("Direct execution result:", result);
        } catch (e) {
          console.error("Execution error:", e);
          await pyodideInstance.runPythonAsync(`
            sys.stderr.write(str(${JSON.stringify(e.message)}))
          `);
        }
        
        // Get the captured output
        const captureResult = pyodideInstance.runPython(`
          # Get captured output
          stdout_content = sys._jupyreact_stdout.getvalue()
          stderr_content = sys._jupyreact_stderr.getvalue()
          
          # Restore original streams
          sys.stdout = sys._original_stdout
          sys.stderr = sys._original_stderr
          
          # Return a tuple of (stdout, stderr)
          (stdout_content, stderr_content)
        `);
        
        // Extract stdout and stderr
        const stdout = captureResult[0];
        const stderr = captureResult[1];
        
        console.log("Captured stdout:", stdout);
        console.log("Captured stderr:", stderr);
        
        // Build final output
        let finalOutput = "";
        
        // First add stdout
        if (stdout) {
          finalOutput += stdout;
        }
        
        // Add stderr if any
        if (stderr) {
          finalOutput += (finalOutput ? "\n" : "") + "Error: " + stderr;
        }
        
        // Add the result value if it's meaningful and not None
        if (result !== undefined && result !== null) {
          try {
            // Convert to string representation
            const resultStr = result.toString();
            if (resultStr !== "undefined" && resultStr !== "None" && !finalOutput.includes(resultStr)) {
              finalOutput += (finalOutput ? "\n" : "") + resultStr;
            }
          } catch (e) {
            console.warn("Failed to convert result to string:", e);
          }
        }
        
        // If no output at all but we had print statements, add a special output
        if (!finalOutput && code.includes("print(")) {
          console.log("No output but print detected, adding special message");
          finalOutput = "Note: print output should appear here";
        }
        
        console.log("Final formatted output:", finalOutput);
        
        return { 
          output: finalOutput || "Code executed successfully (no output)"
        };
      } catch (error) {
        console.error("Python execution error:", error);
        return { error: error.message };
      }
    }
    
    // Cell component
    const CodeCell = ({ id, content, output, isExecuting, language, onContentChange, onExecute, onDelete, onAddCell, onAddPythonCell, onMoveUp, onMoveDown, onChangeType, onChangeLanguage, index, executionCount }) => {
      const textareaRef = React.useRef(null);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && e.shiftKey) {
          e.preventDefault();
          onExecute();
        }
        
        // Command mode shortcuts (when not editing)
        if (document.activeElement !== textareaRef.current) {
          if (e.key === 'j' || e.key === 'ArrowDown') {
            // Move focus to next cell
            const nextCell = e.target.closest('.cell').nextElementSibling;
            if (nextCell) nextCell.querySelector('textarea').focus();
          } else if (e.key === 'k' || e.key === 'ArrowUp') {
            // Move focus to previous cell
            const prevCell = e.target.closest('.cell').previousElementSibling;
            if (prevCell) prevCell.querySelector('textarea').focus();
          } else if (e.key === 'a') {
            // Insert cell above
            onMoveUp();
          } else if (e.key === 'b') {
            // Insert cell below
            onAddCell();
          } else if (e.key === 'd' && e.repeat === false) {
            // Delete cell (double-tap)
            onDelete();
          }
        }
      };

      React.useEffect(() => {
        document.addEventListener('keydown', handleKeyDown);
        return () => {
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      return (
        <div className="cell code-cell" onKeyDown={handleKeyDown}>
          <div className="cell-toolbar">
            <div className="cell-type">
              <span className="execution-count">
                {isExecuting ? '*' : executionCount ? `[${executionCount}]` : '[ ]'}
              </span>
              <span className="language-badge python">Python</span>
            </div>
            <div className="cell-actions">
              <button 
                className="cell-action-btn" 
                onClick={() => onMoveUp(id)}
                title="Move cell up"
              >
                ↑
              </button>
              <button 
                className="cell-action-btn" 
                onClick={() => onMoveDown(id)}
                title="Move cell down"
              >
                ↓
              </button>
              <button 
                className="cell-action-btn" 
                onClick={() => onAddCell(id)}
                title="Add cell below"
              >
                +
              </button>
              <button 
                className="cell-action-btn" 
                onClick={() => onChangeType(id)}
                title="Convert to Markdown"
              >
                M↓
              </button>
              <button 
                className="cell-action-btn" 
                onClick={() => onDelete(id)}
                title="Delete cell"
              >
                🗑️
              </button>
            </div>
          </div>
          
          <div className="cell-input-area">
            <div className="cell-prompt">
              {isExecuting ? 'In [*]:' : executionCount ? `In [${executionCount}]:` : 'In [ ]:'}
            </div>
            <div className="editor-container">
              <textarea
                ref={textareaRef}
                className="editor-textarea"
                value={content}
                onChange={(e) => onContentChange(id, e.target.value)}
                placeholder="# Type Python code here"
              />
            </div>
          </div>
          
          <div className="execution-actions">
            <div className="pyodide-status">
              {!pyodideInstance && 'Loading Python environment...'}
            </div>
            <button
              className="execute-btn"
              onClick={() => onExecute(id)}
              disabled={!pyodideInstance}
            >
              {isExecuting ? 'Running...' : 'Run'}
            </button>
          </div>
          
          {output && (
            <div className="cell-output-area">
              <div className="output-prompt">
                {executionCount ? `Out[${executionCount}]:` : 'Out[ ]:'}
              </div>
              <div className="cell-output">
                <pre style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{output}</pre>
              </div>
            </div>
          )}
        </div>
      );
    };

    const MarkdownCell = ({ id, content, onContentChange, onDelete, onAddCell, onAddPythonCell, onMoveUp, onMoveDown, onChangeType, index }) => {
      const [isEditing, setIsEditing] = React.useState(false);
      const parsedMarkdown = marked.parse(content);

      return (
        <div className={`cell markdown-cell ${isEditing ? 'editing' : ''}`}>
          <div className="cell-toolbar">
            <div className="cell-type">Markdown</div>
            <div className="cell-actions">
              <button
                className="cell-action-btn"
                onClick={() => onChangeType(id)}
                title="Change to Code"
              >
                <span>C</span>
              </button>
              <button
                className="cell-action-btn"
                onClick={() => onMoveUp(id)}
                title="Move Up"
                disabled={index === 0}
              >
                <span>↑</span>
              </button>
              <button
                className="cell-action-btn"
                onClick={() => onMoveDown(id)}
                title="Move Down"
              >
                <span>↓</span>
              </button>
              <button
                className="cell-action-btn"
                onClick={() => onAddCell('markdown', index)}
                title="Add Markdown Cell Below"
              >
                <span>+</span>
              </button>
              <button
                className="cell-action-btn"
                onClick={() => onDelete(id)}
                title="Delete Cell"
              >
                <span>×</span>
              </button>
            </div>
          </div>

          {isEditing ? (
            <div className="editor-container">
              <textarea 
                className="editor-textarea"
                value={content}
                onChange={(e) => onContentChange(id, e.target.value)}
                placeholder="Type your markdown here"
              />
              <div className="markdown-actions">
                <button
                  className="preview-btn"
                  onClick={() => setIsEditing(false)}
                >
                  Preview
                </button>
              </div>
            </div>
          ) : (
            <div 
              className="markdown-display" 
              onClick={() => setIsEditing(true)}
              dangerouslySetInnerHTML={{ __html: parsedMarkdown }}
            />
          )}
        </div>
      );
    };

    // Notebook App
    const NotebookApp = () => {
      // State for the notebook
      const [notebook, setNotebook] = React.useState({
        name: 'Python Notebook',
        cells: [
          { 
            id: uuidv4(), 
            type: 'markdown', 
            content: '# Python Notebook\n\nThis is a Python notebook running directly in your browser using Pyodide.\n\n- Write and execute Python code\n- Format text using Markdown\n- Use keyboard shortcuts (Shift+Enter to execute)\n\nTry running the Python cell below!'
          },
          { 
            id: uuidv4(), 
            type: 'code', 
            content: '# This is a Python cell\nprint("Hello from Python!")\n\n# You can use numpy and other scientific libraries\nimport numpy as np\nnp.array([1, 2, 3, 4, 5]) * 2', 
            output: '', 
            isExecuting: false,
            language: 'python',
            executionCount: null
          }
        ]
      });

      // Execution context for JavaScript cells
      const [executionContext, setExecutionContext] = React.useState({});
      
      // Counter for execution counts
      const [executionCounter, setExecutionCounter] = React.useState(0);
      
      // Pyodide state
      const [pyodideInstance, setPyodideInstance] = React.useState(null);
      const [isPyodideLoading, setIsPyodideLoading] = React.useState(false);

      // State for help modal
      const [isHelpModalOpen, setIsHelpModalOpen] = React.useState(false);

      // Add a new cell
      const addCell = (type = 'code', afterIndex = 0, language = 'python') => {
        let newCell;
        if (type === 'code') {
          newCell = { 
            id: uuidv4(), 
            type, 
            content: '', 
            output: '', 
            isExecuting: false,
            language: 'python', // Always set to Python
            executionCount: null
          };
        } else {
          newCell = { id: uuidv4(), type, content: '' };
        }
        
        const newCells = [...notebook.cells];
        newCells.splice(afterIndex + 1, 0, newCell);
        
        setNotebook({ ...notebook, cells: newCells });
      };
      
      // Add a Python cell (now the default)
      const addPythonCell = (index) => {
        addCell('code', index, 'python');
      };

      // Delete a cell
      const deleteCell = (id) => {
        if (notebook.cells.length <= 1) {
          alert('Cannot delete the last cell');
          return;
        }
        
        setNotebook({
          ...notebook,
          cells: notebook.cells.filter(cell => cell.id !== id)
        });
      };

      // Update cell content
      const updateCellContent = (id, content) => {
        setNotebook({
          ...notebook,
          cells: notebook.cells.map(cell =>
            cell.id === id ? { ...cell, content } : cell
          )
        });
      };
      
      // Change cell language
      const changeCellLanguage = (id, language) => {
        setNotebook({
          ...notebook,
          cells: notebook.cells.map(cell =>
            cell.id === id && cell.type === 'code' 
              ? { ...cell, language } 
              : cell
          )
        });
      };

      // Execute a cell
      const executeCell = async (id) => {
        const index = notebook.cells.findIndex(cell => cell.id === id);
        if (index === -1) return;
        
        const cell = notebook.cells[index];
        if (cell.type !== 'code') return;
        
        // Mark the cell as executing
        setNotebook({
          ...notebook,
          cells: notebook.cells.map(c =>
            c.id === id ? { ...c, isExecuting: true, output: '' } : c
          )
        });
        
        // Increment execution counter
        const currentExecutionCount = executionCounter + 1;
        setExecutionCounter(currentExecutionCount);
        
        try {
          console.log(`Executing cell ${id}:`, cell.content);
          let result = '';
          
          // Initialize Pyodide if not already done
          const pyodide = await initializePyodide();
          
          if (!pyodide) {
            throw new Error("Failed to initialize Python environment. Please try again.");
          }
          
          try {
            // Directly call executePythonCode
            const executionResult = await executePythonCode(cell.content);
            console.log("Execution result:", executionResult);
            
            if (executionResult.error) {
              result = `Error: ${executionResult.error}`;
            } else {
              result = executionResult.output;
            }
            
          } catch (pythonError) {
            console.error("Python execution error:", pythonError);
            result = `Error in Python code: ${pythonError.message || String(pythonError)}`;
          }
          
          console.log("Final output to display in cell:", result);
          
          // Update the cell with the result and execution count
          setNotebook({
            ...notebook,
            cells: notebook.cells.map(c =>
              c.id === id ? { 
                ...c, 
                isExecuting: false, 
                output: result,
                executionCount: currentExecutionCount
              } : c
            )
          });
        } catch (error) {
          // Handle errors
          console.error("Pyodide initialization error:", error);
          setNotebook({
            ...notebook,
            cells: notebook.cells.map(c =>
              c.id === id ? { 
                ...c, 
                isExecuting: false, 
                output: `Error initializing Python environment: ${error.message}. Please try again or refresh the page.`,
                executionCount: currentExecutionCount
              } : c
            )
          });
        }
      };

      // Move cell up
      const moveCellUp = (id) => {
        const index = notebook.cells.findIndex(cell => cell.id === id);
        if (index <= 0) return;

        const newCells = [...notebook.cells];
        const temp = newCells[index];
        newCells[index] = newCells[index - 1];
        newCells[index - 1] = temp;

        setNotebook({ ...notebook, cells: newCells });
      };

      // Move cell down
      const moveCellDown = (id) => {
        const index = notebook.cells.findIndex(cell => cell.id === id);
        if (index === -1 || index >= notebook.cells.length - 1) return;

        const newCells = [...notebook.cells];
        const temp = newCells[index];
        newCells[index] = newCells[index + 1];
        newCells[index + 1] = temp;

        setNotebook({ ...notebook, cells: newCells });
      };

      // Change cell type
      const changeCellType = (id) => {
        const index = notebook.cells.findIndex(cell => cell.id === id);
        if (index === -1) return;

        const cell = notebook.cells[index];
        const newCells = [...notebook.cells];

        if (cell.type === 'code') {
          newCells[index] = { id: cell.id, type: 'markdown', content: cell.content };
        } else {
          newCells[index] = { 
            id: cell.id, 
            type: 'code', 
            content: cell.content, 
            output: '', 
            isExecuting: false,
            language: 'python' 
          };
        }

        setNotebook({ ...notebook, cells: newCells });
      };

      // Clear all outputs
      const clearAllOutputs = () => {
        setNotebook({
          ...notebook,
          cells: notebook.cells.map(cell =>
            cell.type === 'code' ? { ...cell, output: '' } : cell
          )
        });
        setExecutionContext({});
      };

      // Export notebook as JSON
      const exportNotebook = () => {
        const notebookJson = JSON.stringify(notebook, null, 2);
        const blob = new Blob([notebookJson], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `${notebook.name.replace(/\s+/g, '_')}.json`;
        a.click();
        
        URL.revokeObjectURL(url);
      };

      // Store original window keys to avoid capturing them
      React.useEffect(() => {
        window.__ORIGINAL_KEYS = {};
        for (const key in window) {
          window.__ORIGINAL_KEYS[key] = true;
        }
      }, []);
      
      // Initialize Pyodide when the app loads
      React.useEffect(() => {
        const loadPyodideEnvironment = async () => {
          try {
            await initializePyodide();
            console.log("Pyodide environment initialized automatically");
          } catch (error) {
            console.error("Failed to initialize Pyodide environment:", error);
          }
        };
        
        loadPyodideEnvironment();
      }, []);

      // Render each cell based on its type
      const renderCell = (cell, index) => {
        if (cell.type === 'code') {
          return (
            <CodeCell
              key={cell.id}
              id={cell.id}
              content={cell.content}
              output={cell.output}
              isExecuting={cell.isExecuting}
              language={cell.language || 'python'}
              onContentChange={updateCellContent}
              onExecute={executeCell}
              onDelete={deleteCell}
              onAddCell={addCell}
              onAddPythonCell={addPythonCell}
              onMoveUp={moveCellUp}
              onMoveDown={moveCellDown}
              onChangeType={changeCellType}
              onChangeLanguage={changeCellLanguage}
              index={index}
              executionCount={cell.executionCount}
            />
          );
        } else {
          return (
            <MarkdownCell
              key={cell.id}
              id={cell.id}
              content={cell.content}
              onContentChange={updateCellContent}
              onDelete={deleteCell}
              onAddCell={addCell}
              onAddPythonCell={addPythonCell}
              onMoveUp={moveCellUp}
              onMoveDown={moveCellDown}
              onChangeType={changeCellType}
              index={index}
            />
          );
        }
      };

      React.useEffect(() => {
        // Global keyboard shortcuts
        const handleGlobalKeyDown = (event) => {
          // Ignore key events in inputs and textareas
          if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
            return;
          }
          
          // Notebook-level keyboard shortcuts
          if (event.key === 'a' && event.ctrlKey) {
            // Execute all cells
            event.preventDefault();
            executeAllCells();
          } else if (event.key === 'b' && !event.ctrlKey && !event.shiftKey) {
            // Add cell below at the end of the notebook
            event.preventDefault();
            addCell('code', notebook.cells.length - 1, 'python');
          } else if (event.key === 'm' && !event.ctrlKey && !event.shiftKey) {
            // Add markdown cell
            event.preventDefault();
            addCell('markdown', notebook.cells.length - 1);
          } else if (event.key === 'i' && event.ctrlKey) {
            // Interrupt execution
            event.preventDefault();
            // Reset execution state for all executing cells
            setNotebook({
              ...notebook,
              cells: notebook.cells.map(c => 
                c.type === 'code' && c.isExecuting ? 
                  { ...c, isExecuting: false, output: c.output + '\n[Execution interrupted]' } : 
                  c
              )
            });
          }
        };
        
        document.addEventListener('keydown', handleGlobalKeyDown);
        return () => document.removeEventListener('keydown', handleGlobalKeyDown);
      }, [notebook]);
      
      // Execute all cells in order
      const executeAllCells = async () => {
        // Clone cells array to avoid state issues during execution
        const cellsToExecute = [...notebook.cells].filter(cell => cell.type === 'code');
        
        // Reset execution counts
        setExecutionCounter(0);
        
        // Execute cells sequentially
        for (const cell of cellsToExecute) {
          await executeCell(cell.id);
        }
      };

      // Help Modal component
      const HelpModal = ({ isOpen, onClose }) => {
        if (!isOpen) return null;
        
        return (
          <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={e => e.stopPropagation()}>
              <div className="modal-header">
                <h2 className="modal-title">Jupyter Keyboard Shortcuts</h2>
                <button className="modal-close" onClick={onClose}>&times;</button>
              </div>
              
              <div className="shortcut-category">Cell Execution</div>
              <table className="shortcut-table">
                <tbody>
                  <tr>
                    <td><span className="shortcut-key">Shift</span> + <span className="shortcut-key">Enter</span></td>
                    <td>Run the current cell</td>
                  </tr>
                  <tr>
                    <td><span className="shortcut-key">Ctrl</span> + <span className="shortcut-key">A</span></td>
                    <td>Run all cells</td>
                  </tr>
                  <tr>
                    <td><span className="shortcut-key">Ctrl</span> + <span className="shortcut-key">I</span></td>
                    <td>Interrupt execution</td>
                  </tr>
                </tbody>
              </table>
              
              <div className="shortcut-category">Cell Navigation</div>
              <table className="shortcut-table">
                <tbody>
                  <tr>
                    <td><span className="shortcut-key">Up</span> or <span className="shortcut-key">k</span></td>
                    <td>Select cell above</td>
                  </tr>
                  <tr>
                    <td><span className="shortcut-key">Down</span> or <span className="shortcut-key">j</span></td>
                    <td>Select cell below</td>
                  </tr>
                </tbody>
              </table>
              
              <div className="shortcut-category">Cell Creation</div>
              <table className="shortcut-table">
                <tbody>
                  <tr>
                    <td><span className="shortcut-key">a</span></td>
                    <td>Insert cell above</td>
                  </tr>
                  <tr>
                    <td><span className="shortcut-key">b</span></td>
                    <td>Insert cell below</td>
                  </tr>
                  <tr>
                    <td><span className="shortcut-key">m</span></td>
                    <td>Add markdown cell at end</td>
                  </tr>
                </tbody>
              </table>
              
              <div className="shortcut-category">Cell Editing</div>
              <table className="shortcut-table">
                <tbody>
                  <tr>
                    <td><span className="shortcut-key">d</span> <span className="shortcut-key">d</span></td>
                    <td>Delete selected cell</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      return (
        <div className="app-container">
          {isPyodideLoading && (
            <div className="pyodide-loading">
              <span role="status" aria-live="polite">Loading Python environment... This may take a few moments (usually 5-10 seconds). Please wait.</span>
            </div>
          )}
          
          <header className="app-header">
            <h1>JupyterReact</h1>
            <p>A React-based Jupyter notebook alternative</p>
          </header>
          
          <main className="app-content">
            <div className="notebook-container">
              <div className="notebook-header">
                <div className="notebook-title">
                  <input
                    type="text"
                    value={notebook.name}
                    onChange={e => setNotebook({ ...notebook, name: e.target.value })}
                    className="notebook-title-input"
                  />
                </div>
                <div className="notebook-actions">
                  <button 
                    className="notebook-action-btn"
                    onClick={() => addCell('code', notebook.cells.length - 1, 'python')}
                    title="Add Python Cell"
                  >
                    + Python
                  </button>
                  <button 
                    className="notebook-action-btn"
                    onClick={() => addCell('markdown', notebook.cells.length - 1)}
                    title="Add Markdown Cell"
                  >
                    + Markdown
                  </button>
                  <button 
                    className="notebook-action-btn"
                    onClick={executeAllCells}
                    title="Run All Cells (Ctrl+A)"
                  >
                    Run All
                  </button>
                  <button 
                    className="notebook-action-btn"
                    onClick={clearAllOutputs}
                    title="Clear Outputs"
                  >
                    Clear Outputs
                  </button>
                  <button 
                    className="notebook-action-btn"
                    onClick={exportNotebook}
                    title="Export Notebook"
                  >
                    Export
                  </button>
                  <button
                    className="help-btn"
                    onClick={() => setIsHelpModalOpen(true)}
                    title="Keyboard Shortcuts"
                  >
                    ?
                  </button>
                </div>
              </div>

              <div className="notebook-cells">
                {notebook.cells.map((cell, index) => renderCell(cell, index))}
              </div>

              <div className="notebook-footer">
                <button 
                  className="add-cell-btn python"
                  onClick={() => addCell('code', notebook.cells.length - 1, 'python')}
                >
                  + Add Python Cell
                </button>
                <button 
                  className="add-cell-btn"
                  onClick={() => addCell('markdown', notebook.cells.length - 1)}
                >
                  + Add Markdown Cell
                </button>
              </div>
            </div>
          </main>
          
          <footer className="app-footer">
            <p>React-based Jupyter notebook running in the browser</p>
          </footer>
          
          <HelpModal isOpen={isHelpModalOpen} onClose={() => setIsHelpModalOpen(false)} />
        </div>
      );
    };

    ReactDOM.render(<NotebookApp />, document.getElementById('root'));
  </script>
</head>
<body>
  <div id="root"></div>
</body>
  <script>
    // Fix for Python print output
    (function() {
      // Run this after a short delay to ensure the page is loaded
      setTimeout(() => {
        console.log("Running Python output fix...");
        
        // Function to execute when a Python cell runs
        function fixPythonOutput() {
          // Find all code cells
          const codeCells = document.querySelectorAll('.code-cell');
          
          codeCells.forEach(cell => {
            // Get the execute button for this cell
            const executeBtn = cell.querySelector('.execute-btn');
            
            if (executeBtn && !executeBtn.dataset.outputFixed) {
              // Mark as fixed to avoid duplicate handlers
              executeBtn.dataset.outputFixed = 'true';
              
              // Save the original click handler
              const originalClickHandler = executeBtn.onclick;
              
              // Replace with our custom handler
              executeBtn.onclick = function(e) {
                // Call the original handler
                if (originalClickHandler) {
                  originalClickHandler.call(this, e);
                }
                
                // Check if it's a Python cell
                const isPython = cell.querySelector('.python-indicator');
                if (!isPython) return;
                
                // After a short delay to allow execution
                setTimeout(() => {
                  // Get the editor content
                  const editorContent = cell.querySelector('.monaco-editor')?.textContent || '';
                  
                  // Check if there are print statements
                  if (editorContent.includes('print(')) {
                    // Find or create output div
                    let outputDiv = cell.querySelector('.cell-output');
                    if (!outputDiv) {
                      outputDiv = document.createElement('div');
                      outputDiv.className = 'cell-output';
                      const pre = document.createElement('pre');
                      outputDiv.appendChild(pre);
                      cell.appendChild(outputDiv);
                    }
                    
                    // Get the pre element
                    const pre = outputDiv.querySelector('pre');
                    if (pre && !pre.textContent.trim()) {
                      // If output is empty but should have print statements, try to simulate output
                      const printMatches = editorContent.match(/print\((["'`].*?["'`])\)/g);
                      if (printMatches) {
                        const outputText = printMatches
                          .map(match => {
                            // Extract what's inside the print statement
                            try {
                              const content = match.substring(6, match.length - 1);
                              // Simple evaluation of string constants
                              if (content.startsWith('"') || content.startsWith("'") || content.startsWith("`")) {
                                return content.substring(1, content.length - 1);
                              } else {
                                // For variables or expressions, use a placeholder
                                return "[Output of: " + content + "]";
                              }
                            } catch(e) {
                              return match;
                            }
                          })
                          .join('\n');
                          
                        pre.textContent = outputText;
                      }
                    }
                  }
                }, 500);
              };
            }
          });
        }
        
        // Run the fix initially
        fixPythonOutput();
        
        // Setup a mutation observer to detect new cells
        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            if (mutation.type === 'childList' && mutation.addedNodes.length) {
              fixPythonOutput();
            }
          }
        });
        
        // Start observing the notebook
        const notebook = document.querySelector('.notebook-cells');
        if (notebook) {
          observer.observe(notebook, { childList: true, subtree: true });
        }
        
        console.log("Python output fix installed");
      }, 2000);
    })();
  </script>
</html>
